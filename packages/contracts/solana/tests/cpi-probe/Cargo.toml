[package]
name = "cpi-probe"
version = "0.1.0"
description = "Test only, never deployed: a program that calls skech's place from inside itself, as an attacker's would"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
solana-account-info = "2.2"
solana-cpi = "2.2"
solana-instruction = "2.2"
solana-program-entrypoint = "2.2"
solana-program-error = "2.2"
solana-pubkey = "2.2"

[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Its own workspace: built on its own by the attack test (`cargo build-sbf`), not with the program.
[workspace]
