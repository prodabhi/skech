[package]
name = "tests"
version = "0.1.0"
description = "The skech program, run in LiteSVM"
edition = "2021"
rust-version = "1.89.0"
publish = false

[dependencies]

[dev-dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "associated_token"] }
skech = { path = "../programs/skech", features = ["no-entrypoint"] }
litesvm = "0.7.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-message = "2.2"
solana-address-lookup-table-interface = "2.2"
solana-ed25519-program = "2.2"
solana-loader-v3-interface = "3"
solana-account = "2.2"
solana-instruction = "2.3"
solana-transaction-error = "2.2"
solana-clock = "2.2"
solana-sha256-hasher = "2"
ed25519-dalek = "=1.0.1"
bincode = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
