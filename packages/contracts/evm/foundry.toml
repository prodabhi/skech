[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
# Dependencies come from bun, hoisted to the monorepo root, not git submodules.
libs = ["../../../node_modules"]
solc = "0.8.30"
# Monad's gas model, opcode pricing and 128 KB code size limit (Foundry 1.8+).
network = "monad"
optimizer = true
optimizer_runs = 1000
# Stack-too-deep in a batch placer with many calldata structs: via IR.
via_ir = true
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "../solana/tests/vectors" }]
# Every top-level call in a test is its own transaction, starting cold, as on chain: test/GasModel.t.sol measures
# what the relayer's transactions cost and needs that; the rest of the suite is indifferent.
isolate = true

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
# The handler only makes calls that should go through, and checks the reverts it expects itself: any other revert
# is a failure.
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"
