[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.7.3"
alloy-signer = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-sol-types = "1.7.3"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# A feed that panics must take the server down with it, not leave it up and silent.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
